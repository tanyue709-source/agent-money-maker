name: Auto Register Agent Service

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时检查一次，尝试重新注册

permissions:
  contents: write
  pull-requests: write

jobs:
  register-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Wait for Render Deployment
        run: |
          echo "等待 Render 部署完成（最多 5 分钟）..."
          MAX_ATTEMPTS=10
          ATTEMPT=0
          SUCCESS=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "尝试 $ATTEMPT/$MAX_ATTEMPTS: 检查服务状态..."
            
            # 先检查基础服务是否可达
            BASE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://agent-money-maker.onrender.com/ 2>/dev/null)
            
            if [ "$BASE_STATUS" = "200" ]; then
              # 检查 discovery 端点
              DISCOVERY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://agent-money-maker.onrender.com/.well-known/agent-discovery.json 2>/dev/null)
              
              if [ "$DISCOVERY_STATUS" = "200" ]; then
                echo "✅ Discovery endpoint 可用 (HTTP $DISCOVERY_STATUS)"
                SUCCESS=true
                break
              else
                echo "  ⏳ Discovery 端点返回 $DISCOVERY_STATUS，部署中..."
              fi
            else
              echo "  ⏳ 服务返回 $BASE_STATUS，Render 部署中..."
            fi
            
            # 等待 30 秒后重试
            echo "  等待 30 秒后重试..."
            sleep 30
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ 部署超时：超过 5 分钟仍未就绪"
            echo "请检查 Render 控制台: https://render.com/dashboard"
            exit 1
          fi
          
          echo "✅ Render 部署成功!"

      - name: Generate Service Metadata
        run: |
          cat > service-metadata.json << EOF
          {
            "name": "XiaoPingGuo Sentiment Agent",
            "url": "https://agent-money-maker.onrender.com/api/v1/sentiment",
            "discovery": "https://agent-money-maker.onrender.com/.well-known/agent-discovery.json",
            "price": "0.1 USDC",
            "capabilities": ["sentiment_analysis", "crypto_market", "x402_payment"],
            "recipient": "0x794D627B076C1167abF130fBbC91e60873af94F4",
            "status": "active",
            "last_updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Metadata generated:"
          cat service-metadata.json

      - name: Create/Update Pull Request to Awesome Agent List
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🍎 Auto-register XiaoPingGuo Agent Service (Auto-generated)"
          branch: "auto-register-agent-service"
          delete-branch: true
          title: "🍎 Add/Update XiaoPingGuo Sentiment Agent (x402)"
          body: |
            ## 🍎 Service Registration: XiaoPingGuo Sentiment Agent
            This PR is auto-generated by the XiaoPingGuo Agent's deployment pipeline.
            
            - **API**: https://agent-money-maker.onrender.com/api/v1/sentiment
            - **Discovery**: https://agent-money-maker.onrender.com/.well-known/agent-discovery.json
            - **Price**: 0.1 USDC/call (x402)
            - **Status**: ✅ Active
            - **Verified**: Service is online and accepting x402 payments.
            
            Please merge to add/update this service in the Awesome Agent list.
          labels: "x402, agent, sentiment-analysis, automated"
          base: main
          signoff: false

      - name: Log Registration Status
        run: |
          echo "✅ Registration attempt completed. Check PR status in repository."
